name: "🛠️ Integration Task"
description: "통합·CI·협업 설정 업무를 등록합니다. Jira Task가 자동 생성됩니다."
title: "[INT] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: "생성 직후 Jira 키가 제목 앞에 자동 추가되고 Slack에 연결 결과가 전송됩니다."
  - type: input
    id: parent_jira
    attributes:
      label: "상위 Jira 키 (선택)"
      description: "기존 Epic 아래에 둘 경우 SCRUM-6 형식으로 입력하세요."
      placeholder: "SCRUM-6"
  - type: textarea
    id: goal
    attributes:
      label: "완료 목표"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "완료 조건"
      value: |
        - [ ] 설정 또는 문서 변경 완료
        - [ ] Docker Compose 및 필요한 검증 통과
        - [ ] development 대상 PR 준비
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "참고 사항"
